    <style>
        body { background-color: #0b0b0b; color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        
        /* شاشة الترحيب */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 1s;
        }
        #welcome-screen h1 { color: #ff0000; font-size: 2.5rem; margin-bottom: 5px; text-align: center; }
        #welcome-screen p { color: #ff0000; font-size: 1.2rem; text-align: center; }

        /* الهيدر والبحث */
        .header { padding: 20px; text-align: center; background: #1a1a1a; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #ff0000; }
        .search-box { width: 90%; max-width: 600px; padding: 12px; border-radius: 25px; border: 2px solid #ff0000; background: #000; color: white; outline: none; text-align: center; }

        /* قائمة الفيديوهات */
        .video-list { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 20px; }
        .video-card { width: 100%; max-width: 500px; background: #1a1a1a; border-radius: 25px; overflow: hidden; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        video { width: 100%; display: block; border-radius: 25px 25px 0 0; }
        .video-info { padding: 15px; text-align: center; }
        .video-info h3 { margin: 0; color: #ff0000; font-size: 18px; }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>

    <script>
        // إخفاء الترحيب
        setTimeout(() => {
            document.getElementById('welcome-screen').classList.add('hidden');
        }, 3000);

        // وظيفة البحث
        function searchVideo() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('video-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "block" : "none";
            }
        }
